[project]
name = "langc-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hasan Nasser", email = "hasan.nasser012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langc-course = "langc_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
